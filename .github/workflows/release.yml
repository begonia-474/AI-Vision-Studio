# 自动发布：打 v* 标签（如 v0.2.0）时，在三平台构建安装包并创建 GitHub Release 草稿。
# 用法：git tag v0.2.0 && git push origin v0.2.0
# 草稿需人工在 Releases 页确认后再发布，避免误发坏包。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # tauri-action 不装项目依赖（只装全局 tauri CLI），必须显式 npm ci：
      # 否则 macOS 无 node_modules（tsc not found），且自动安装会装到 TS 6 报 baseUrl 移除。
      - name: 安装前端依赖
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Vision Studio ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
          autoInstallDeps: false
          args: ${{ matrix.args }}
