# 持续检查：每次推送 / PR 自动跑前端与后端门禁。
# 本地提交不触发（Actions 跑在 GitHub 服务器）；推送后可在仓库 Actions 页查看结果。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（tsc + vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: 后端（fmt + clippy + check + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri Linux 系统依赖（构建脚本探测需要；release 工作流同样依赖）
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 格式检查（cargo fmt --check）
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy 严格门禁（-D warnings）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: 类型检查（cargo check --all-targets）
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: 单元测试（cargo test）
        working-directory: src-tauri
        run: cargo test
